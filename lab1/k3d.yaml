apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: ds-lab1
servers: 1
agents: 1
image: rancher/k3s:v1.34.1-k3s1
kubeAPI:
  hostIP: "127.0.0.1"
  hostPort: "6550"
ports:
  - port: "127.0.0.1:8080:30080"
    nodeFilters:
      - server:0:direct
options:
  k3d:
    wait: true
    timeout: 180s
    disableLoadbalancer: true
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
      - arg: --disable=servicelb
        nodeFilters:
          - server:*
